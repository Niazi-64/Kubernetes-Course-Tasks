apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-read
  namespace: {{ .Release.Namespace }}
  labels:
    app: mysql
    role: read
spec:
  replicas: {{ .Values.mysql.read.replicaCount }}
  selector:
    matchLabels:
      app: mysql
      role: read
  template:
    metadata:
      labels:
        app: mysql
        role: read
    spec:
      containers:
        - name: mysql
          image: "{{ .Values.mysql.read.image.repository }}:{{ .Values.mysql.read.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROLE
              value: "replica"
            - name: MYSQL_SOURCE_HOST
              value: "mysql-write"
            - name: MYSQL_REPL_USER
              value: "repl"
            - name: MYSQL_REPL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: replication-password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: root-password
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
              subPathExpr: read/$(POD_NAME)
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc
